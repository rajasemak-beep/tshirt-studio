<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>T-Shirt Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>T-SHIRT STUDIO</h1>
    <p>Studio desain dan produksi kaos pria</p>
</header>

<main>

    <!-- AREA PREVIEW -->
    <section class="preview">

        <h2>PREVIEW DESAIN KAOS</h2>

        <div class="shirt">
            
<svg viewBox="0 0 300 300">

    <!-- DEPAN -->
    <g id="shirtFront">

        <!-- BADAN KAOS DEPAN -->
        <path
            id="shirtBodyFront"
            d="
                M110 42
                C96 44 82 51 68 60
                L30 86
                L48 132
                L75 116
                L80 264
                L220 264
                L225 116
                L252 132
                L270 86
                L232 60
                C218 51 204 44 190 42
                C181 62 168 73 150 73
                C132 73 119 62 110 42
                Z
            "
            fill="#f0f0f0"
            stroke="#aeb8c5"
            stroke-width="2.5"
            stroke-linejoin="round"/>

        <!-- KERAH DEPAN -->
        <path
            d="M110 42 Q150 91 190 42"
            fill="none"
            stroke="#8e9aaa"
            stroke-width="8"
            stroke-linecap="round"/>

        <path
            d="M110 42 Q150 91 190 42"
            fill="none"
            stroke="#e2e7ed"
            stroke-width="2"/>

        <!-- JAHITAN BAHU -->
<path
    d="M110 44 L68 60 M190 44 L232 60"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- KERUNG LENGAN -->
<path
    d="M68 60 Q76 82 75 116 M232 60 Q224 82 225 116"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- KELIM UJUNG LENGAN -->
<path
    d="M35 92 L51 128 M265 92 L249 128"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- JAHITAN SAMPING -->
        <path
            d="M87 145 L90 254 M213 145 L210 254"
            fill="none"
            stroke="#b5bec9"
            stroke-width="1"
            stroke-dasharray="3 3"/>
        
<!-- KELIM BAWAH KAOS -->
<path
    d="M81 256 L219 256"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

<path
    d="M81 260 L219 260"
    fill="none"
    stroke="#c0c8d2"
    stroke-width="1"/>

    </g>


    <!-- BELAKANG -->
    <g id="shirtBack" style="display:none">

        <!-- BADAN KAOS BELAKANG -->
        <path
            id="shirtBodyBack"
            d="
                M110 42
                C96 44 82 51 68 60
                L30 86
                L48 132
                L75 116
                L80 264
                L220 264
                L225 116
                L252 132
                L270 86
                L232 60
                C218 51 204 44 190 42
                C181 51 168 57 150 57
                C132 57 119 51 110 42
                Z
            "
            fill="#f0f0f0"
            stroke="#aeb8c5"
            stroke-width="2.5"
            stroke-linejoin="round"/>

        <!-- KERAH BELAKANG -->
        <path
            d="M110 42 Q150 70 190 42"
            fill="none"
            stroke="#8e9aaa"
            stroke-width="8"
            stroke-linecap="round"/>

        <path
            d="M110 42 Q150 70 190 42"
            fill="none"
            stroke="#e2e7ed"
            stroke-width="2"/>

        <!-- JAHITAN BAHU -->
<path
    d="M110 44 L68 60 M190 44 L232 60"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- KERUNG LENGAN -->
<path
    d="M68 60 Q76 82 75 116 M232 60 Q224 82 225 116"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- KELIM UJUNG LENGAN -->
<path
    d="M35 92 L51 128 M265 92 L249 128"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

        <!-- JAHITAN SAMPING -->
        <path
            d="M87 145 L90 254 M213 145 L210 254"
            fill="none"
            stroke="#b5bec9"
            stroke-width="1"
            stroke-dasharray="3 3"/>

        <!-- KELIM BAWAH KAOS -->
<path
    d="M81 256 L219 256"
    fill="none"
    stroke="#8e9aaa"
    stroke-width="1.5"
    stroke-dasharray="3 3"/>

<path
    d="M81 260 L219 260"
    fill="none"
    stroke="#c0c8d2"
    stroke-width="1"/>

    </g>

</svg>

        </div>

        <!-- TOMBOL DEPAN BELAKANG -->
        <div class="buttons">

            <button class="active" id="btnFront">
                Depan
            </button>

            <button id="btnBack">
                Belakang
            </button>

        </div>

    </section>


    <!-- PANEL PENGATURAN -->
    <section class="panel">

        <h3>Pengaturan Desain</h3>

        <label for="shirtColor">
            Warna Kaos
        </label>

        <input
            type="color"
            id="shirtColor"
            value="#f0f0f0">

        <br><br>

        <label for="shirtSize">
            Ukuran Kaos
        </label>

        <select id="shirtSize">

            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>

        </select>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
