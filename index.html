<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101522;
            color: white;
        }

        header {
            padding: 20px;
            background: #192235;
            border-bottom: 1px solid #303b50;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
            color: #55aaff;
        }

        header p {
            margin: 6px 0 0;
            color: #aab5c8;
            font-size: 13px;
        }

        main {
            padding: 18px;
            max-width: 600px;
            margin: auto;
        }

        .preview {
            background: #202c40;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .preview h2 {
            font-size: 17px;
            margin-top: 0;
        }

        .shirt {
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: auto;
        }

        .shirt svg {
            width: 100%;
            height: 100%;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #35445e;
            color: white;
            font-size: 14px;
        }

        button.active {
            background: #278be5;
        }

        .panel {
            background: #202c40;
            padding: 18px;
            margin-top: 18px;
            border-radius: 18px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 16px;
        }

        .coming {
            color: #aab5c8;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header>
    <h1>T-SHIRT STUDIO</h1>
    <p>Studio desain dan produksi kaos pria</p>
</header>

<main>

    <section class="preview">
        <h2>PREVIEW DESAIN KAOS</h2>

        <div class="shirt">
            <svg viewBox="0 0 300 300">
                <path
                    d="M100 35 L65 50 L20 100 L55 130 L80 105
                    L80 270 L220 270 L220 105 L245 130
                    L280 100 L235 50 L200 35
                    Q150 75 100 35 Z"
                    fill="#f0f0f0"
                    stroke="#b8c0cc"
                    stroke-width="3"/>

                <path
                    d="M100 35 Q150 90 200 35"
                    fill="none"
                    stroke="#b8c0cc"
                    stroke-width="5"/>
            </svg>
        </div>

        <div class="buttons">
            <button class="active">Depan</button>
            <button>Belakang</button>
        </div>
    </section>

    <section class="panel">
        <h3>Pengaturan Desain</h3>
        <p class="coming">
            Fitur editor desain akan dikembangkan di tahap berikutnya.
            Nantinya kamu bisa mengatur warna, ukuran, gambar,
            tulisan, dan posisi desain kaos.
        </p>
    </section>

</main>

</body>
</html>
