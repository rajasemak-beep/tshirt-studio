<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>T-SHIRT STUDIO</h1>
    <p>Studio desain dan produksi kaos pria</p>
</header>

<main>

    <section class="preview">
        <h2>PREVIEW DESAIN KAOS</h2>

        <div class="shirt">
            <svg viewBox="0 0 300 300">
                <path
                    d="M100 35 L65 50 L20 100 L55 130 L80 105
                    L80 270 L220 270 L220 105 L245 130
                    L280 100 L235 50 L200 35
                    Q150 75 100 35 Z"
                    fill="#f0f0f0"
                    stroke="#b8c0cc"
                    stroke-width="3"/>

                <path
                    d="M100 35 Q150 90 200 35"
                    fill="none"
                    stroke="#b8c0cc"
                    stroke-width="5"/>
            </svg>
        </div>

        <div class="buttons">
            <button class="active">Depan</button>
            <button>Belakang</button>
        </div>
    </section>

    <section class="panel">
    <h3>Pengaturan Desain</h3>

    <label for="shirtColor">Warna Kaos</label>

    <input
        type="color"
        id="shirtColor"
        value="#f0f0f0"
    >
        <p class="coming">
            Fitur editor desain akan dikembangkan di tahap berikutnya.
            Nantinya kamu bisa mengatur warna, ukuran, gambar,
            tulisan, dan posisi desain kaos.
        </p>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
